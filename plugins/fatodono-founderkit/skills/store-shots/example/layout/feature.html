<!doctype html>
<!-- The Play feature graphic, one per Play language. The engine adds the
     copy (`feature_graphic.<key>` for every [data-copy] here, all required)
     and places every [data-place] from placement.yaml's `feature_graphic`. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="feature.css">
</head>
<body>
  <div class="blob blob-sky"></div>
  <div class="blob blob-pink"></div>
  <header class="copy" data-place="copy">
    <p class="wordmark" data-copy="wordmark" data-stop></p>
    <h1 class="headline" data-place="headline" data-copy="headline" data-stop data-fit-lines="2"></h1>
  </header>
</body>
</html>
