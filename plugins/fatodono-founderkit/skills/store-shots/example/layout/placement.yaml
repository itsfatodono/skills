# Where each element sits, per frame kind (or target id) and per panel; the
# format is in the store-shots skill's docs/layout.md. A badge sits 1.7 of its
# font size above its card's top edge.

iphone:
  device: {--screen-w: 69vw, left: 6vw, top: 25vh}
  card: {left: 27vw, width: 68vw, top: 61vh, border-radius: 4vw}
  badge: {left: 41vw, top: calc(61vh - 6.8vw), font-size: 4vw}
  cluster:
    mac: {--screen-w: 84vw, left: 8vw, top: 23.5vh}
    ipad: {--screen-w: 58vw, left: 4vw, top: 48vh}
    iphone: {--screen-w: 31vw, left: 63vw, top: 59vh}
  landscape:
    copy: {left: 6vw, right: auto, width: 32vw, top: 50vh, transform: translateY(-50%), text-align: left}
    headline: {font-size: 4.4vw}
    subline: {margin-top: 2.5vh, font-size: 1.9vw}
    device: {--screen-w: 56vw, left: 41vw, top: 20vh}
    card: {left: 48vw, width: 30vw, top: 60vh, border-radius: 1.6vw}
    badge: {left: 50vw, top: calc(60vh - 3.06vw), font-size: 1.8vw}
    cluster:
      mac: {--screen-w: 42vw, left: 46vw, top: 10vh}
      ipad: {--screen-w: 26vw, left: 40vw, top: 42vh}
      iphone: {--screen-w: 22vw, left: 73vw, top: 60vh}

ipad:
  copy: {left: 14vw, right: 14vw, top: 5vh}
  headline: {font-size: 7.4vw}
  subline: {margin-top: 1vh, font-size: 3.3vw}
  device: {--screen-w: 70vw, left: 7vw, top: 23vh}
  card: {left: 52vw, width: 42vw, top: 61vh, border-radius: 2.8vw}
  badge: {left: 54vw, top: calc(61vh - 3.91vw), font-size: 2.3vw}
  cluster:
    mac: {--screen-w: 70vw, left: 15vw, top: 25vh}
    ipad: {--screen-w: 39vw, left: 8vw, top: 50vh}
    iphone: {--screen-w: 18vw, left: 70vw, top: 62vh}
  landscape:
    copy: {left: 6vw, right: auto, width: 32vw, top: 50vh, transform: translateY(-50%), text-align: left}
    headline: {font-size: 5.2vw}
    subline: {margin-top: 2.5vh, font-size: 2.3vw}
    device: {--screen-w: 54vw, left: 41vw, top: 22vh}
    card: {left: 41vw, width: 30vw, top: 60vh, border-radius: 1.4vw}
    badge: {left: 43vw, top: calc(60vh - 2.72vw), font-size: 1.6vw}
    cluster:
      mac: {--screen-w: 46vw, left: 46vw, top: 14vh}
      ipad: {--screen-w: 28vw, left: 40vw, top: 50vh}
      iphone: {--screen-w: 20vw, left: 76vw, top: 68vh}

mac:
  copy: {left: 20vw, right: 20vw, top: 6vh}
  headline: {font-size: 4vw}
  subline: {margin-top: 1vh, font-size: 1.9vw}
  device: {--screen-w: 52vw, left: 22vw, top: 24vh}
  card: {left: 58vw, width: 30vw, top: 58vh, border-radius: 1.6vw}
  badge: {left: 60vw, top: calc(58vh - 2.72vw), font-size: 1.6vw}
  cluster:
    mac: {--screen-w: 50vw, left: 25vw, top: 23vh}
    ipad: {--screen-w: 20vw, left: 12vw, top: 40vh}
    iphone: {--screen-w: 8.5vw, left: 72vw, top: 50vh}

